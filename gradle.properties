org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# The Maven namespace verified on Central is io.flagdash, matching the domain
# we own (flagdash.io). The Kotlin package stays com.flagdash.sdk — a groupId
# and a package need not match, and renaming the package would move every
# source file and every import for no functional gain.
GROUP=io.flagdash
VERSION_NAME=0.1.0
